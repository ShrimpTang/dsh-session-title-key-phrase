# dsh-session-title-key-phrase bundle patch: mount the host-side session
# titler.
#
# Applied when this bundle appears in a profile's dsh.profile.bundles list.
# Registers a sessionTitle provider (`automatic: 'first-prompt'`) that names
# each session after a key phrase extracted from its first human question.
#
# The profile's `session-title-llm` bundle occupies the single provider slot,
# so disable it in the profile's own cordis.patch.yml and restart the web app
# for this provider to register:
#   - id: session-title-llm
#     disabled: true

- insert:
    - id: session-title-key-phrase
      name: dsh-session-title-key-phrase
